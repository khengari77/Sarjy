name: checks
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: bash scripts/check_types.sh
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run vulture apps/api/app/domain --min-confidence 90
      - run: uv run mypy
      - run: uv run lint-imports
        env:
          PYTHONPATH: apps/api
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web format:check
      - run: pnpm --dir apps/web test:unit
      - run: pnpm --dir apps/web check
      - run: pnpm --dir apps/web build
      - run: uv run pytest -q
        env:
          CI: "true"
      - run: pnpm --dir apps/web test:browser
      - run: pnpm --dir apps/web test:proxy

  postgres:
    # This PR is the top of the Day 2 stack: the pgvector gates exercise
    # modules and fixtures delivered by #31-#35. Run them once those are
    # merged into the branch; before that there is nothing real to verify.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Both disposable URLs are required by tests/conftest.py for every
    # DB-backed step. Defining them once here means a new step inherits the
    # full environment instead of failing before collection. Steps that need a
    # different database override the value locally (see Migration preservation).
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test-only@localhost/integration_tests
      TEST_MEMORY_POSTGRES_URL: postgresql+asyncpg://postgres:test-only@localhost/memory_tests
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Create isolated verification databases
        run: |
          uv run python - <<'PYCODE'
          import asyncio, asyncpg
          async def main():
              db = await asyncpg.connect('postgresql://postgres:test-only@localhost/postgres')
              for name in ('migration_tests', 'memory_tests', 'integration_tests'):
                  await db.execute('CREATE DATABASE ' + name)
              await db.close()
          asyncio.run(main())
          PYCODE
      - name: Migration preservation
        run: uv run pytest -q tests/test_migrations.py
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test-only@localhost/migration_tests
      - name: Prepare service databases
        run: |
          DATABASE_URL=postgresql+asyncpg://postgres:test-only@localhost/memory_tests uv run python -m alembic upgrade head
          DATABASE_URL=postgresql+asyncpg://postgres:test-only@localhost/integration_tests uv run python -m alembic upgrade head
      - name: Dispatcher lease recovery
        run: uv run pytest -q tests/test_action_leases_postgres.py
        env:
          REQUIRE_DAY2_INTEGRATION: '1'
          TEST_MEMORY_POSTGRES_URL: postgresql+asyncpg://postgres:test-only@localhost/memory_tests
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test-only@localhost/integration_tests
      - name: Reviewer admission concurrency
        # -v prints each test as PASSED; a silent skip must never look like a gate.
        run: uv run pytest -v tests/test_reviewer_access_postgres.py
        env:
          REQUIRE_DAY2_INTEGRATION: '1'
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test-only@localhost/integration_tests
      - name: Memory claim concurrency
        # The write ledger's duplicate-request guarantee is only meaningful on a
        # real PostgreSQL database; run it as its own required step so a failure
        # is attributable. A skip fails the step via tests/conftest.py.
        run: uv run pytest -q tests/test_memory_claims_postgres.py
        env:
          REQUIRE_DAY2_INTEGRATION: '1'
          TEST_MEMORY_POSTGRES_URL: postgresql+asyncpg://postgres:test-only@localhost/memory_tests
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test-only@localhost/integration_tests
      - name: Wordle per-game concurrency
        # FOR UPDATE is a no-op on SQLite; this step is the only coverage of
        # the PostgreSQL game-row serialization. A skip fails the step via
        # tests/conftest.py.
        run: uv run pytest -v tests/test_wordle_postgres.py
        env:
          REQUIRE_DAY2_INTEGRATION: '1'
          REQUIRE_WORDLE_POSTGRES: '1'
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test-only@localhost/integration_tests
          TEST_MEMORY_POSTGRES_URL: postgresql+asyncpg://postgres:test-only@localhost/integration_tests
      - name: Real vector and integration checks
        run: |
          uv run python -c "import sys; sys.path.insert(0, 'apps/api'); import app.services.memory, app.services.context_operations, app.domain.weather_permissions"
          uv run pytest -q tests/test_memory_postgres.py tests/test_memory_capture_postgres.py tests/test_day2_integration.py tests/test_memory_transaction_boundary.py tests/test_tool_operations_postgres.py tests/test_context_bounded_retrieval.py
        env:
          REQUIRE_DAY2_INTEGRATION: '1'
          TEST_MEMORY_POSTGRES_URL: postgresql+asyncpg://postgres:test-only@localhost/memory_tests
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test-only@localhost/integration_tests
