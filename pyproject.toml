[project]
name = "sarjy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aiosqlite>=0.22.1",
    "livekit-api>=1",
    "livekit-agents[deepgram,elevenlabs,openai,silero]~=1.8",
    "pgvector>=0.3",
]
[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8",
    "ruff==0.17.5",
    "vulture>=2.14",
]
[tool.pytest.ini_options]
pythonpath = ["apps/api", "services/voice-agent"]
testpaths = ["tests"]
filterwarnings = ["error"]
norecursedirs = [".*", "*.egg", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "artifacts", ".hypothesis"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "I", "UP", "SIM", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"apps/api/app/**" = ["B008"]

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The domain is pure"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.services",
    "app.infrastructure",
    "app.routes",
    "fastapi",
    "sqlalchemy",
    "httpx",
    "livekit",
]

[[tool.importlinter.contracts]]
name = "Services do not import routes"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.routes"]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = ["app.routes", "app.services", "app.domain"]

[tool.mypy]
python_version = "3.12"
mypy_path = "apps/api:services/voice-agent"
files = ["apps/api/app/domain", "services/voice-agent/generation.py"]
strict = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.domain.pipeline"]
disable_error_code = ["prop-decorator"]
