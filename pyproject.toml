[project]
name = "sarjy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aiosqlite>=0.22.1",
    "livekit-api>=1",
    "livekit-agents[deepgram,elevenlabs,openai,silero]~=1.8",
    "pgvector>=0.3",
]
[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=8",
    "ruff>=0.9",
]
[tool.pytest.ini_options]
pythonpath = ["apps/api", "services/voice-agent"]
testpaths = ["tests"]
norecursedirs = [".*", "*.egg", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "artifacts", ".hypothesis"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "I", "UP", "SIM", "B"]

[tool.ruff.lint.per-file-ignores]
"apps/api/app/**" = ["B008"]
