[project]
name = "sarjy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aiosqlite>=0.22.1",
    "livekit-api>=1",
    "livekit-agents[deepgram,elevenlabs,openai,silero]~=1.8",
    "pgvector>=0.3",
]
[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=8",
    "ruff==0.17.5",
    "mypy>=1.13",
]
[tool.pytest.ini_options]
pythonpath = ["apps/api", "services/voice-agent"]

testpaths = ["tests"]
norecursedirs = [".*", ".hypothesis", "artifacts", "node_modules", "build", "dist", "venv"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["artifacts", "*.md"]

[tool.ruff.lint]
select = ["E9", "F", "I", "UP", "SIM", "B"]

[tool.ruff.lint.per-file-ignores]
"apps/api/app/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "apps/api:services/voice-agent"
files = ["apps/api/app/domain", "services/voice-agent/generation.py"]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.domain.pipeline"]
disable_error_code = ["prop-decorator"]
