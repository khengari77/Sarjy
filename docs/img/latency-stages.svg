    <text x="589.86" y="145" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="600">command</text>
    <rect x="662.62" y="118" width="174.9" height="46" fill="#CC79A7" stroke="#f8f9fb" stroke-width="1"/>
    <text x="750.07" y="145" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="600">model first chunk</text>
