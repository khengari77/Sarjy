    <text x="856.02" y="249" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="600">tts</text>
    <text x="889.14" y="250" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="700">2,313 ms</text>
    <text x="32" y="368" font-size="10.5" text-anchor="start" fill="#4a4a4a">Source: docs/data/latency-history.json. Bar totals sum the worker stages.</text>
