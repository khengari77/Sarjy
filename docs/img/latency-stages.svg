    <text x="328.47" y="249" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">end of turn</text>
    <rect x="406.94" y="222" width="105.54" height="46" fill="#E69F00" stroke="#f8f9fb" stroke-width="1"/>
    <text x="459.71" y="249" font-size="11" text-anchor="middle" fill="#1a1a1a" font-weight="600">turn start</text>
    <rect x="512.48" y="222" width="145.52" height="46" fill="#009E73" stroke="#f8f9fb" stroke-width="1"/>
