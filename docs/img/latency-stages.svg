    <text x="522" y="296" font-size="11" text-anchor="middle" fill="#4a4a4a">1,000</text>
    <line x1="658" y1="106" x2="658" y2="274" stroke="#e3e5e9" stroke-width="1"/>
    <text x="658" y="296" font-size="11" text-anchor="middle" fill="#4a4a4a">1,500</text>
